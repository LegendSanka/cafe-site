<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - Sunny Corner Cafe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Sunny Corner Cafe</h1>
    <p>Fresh coffee and homemade cakes in the heart of town.</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="contact.html">Contact</a>
  </nav>

  <main>
    <h2>Get in touch</h2>
    <p>Questions or want to book a table? Send us a message.</p>

    <form action="https://formspree.io/f/mljbvqyv" method="POST">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Your email</label>
      <input type="email" id="email" name="email" required>

      <label for="message">Message</label>
      <textarea id="message" name="message" rows="5" required></textarea>

      <button type="submit">Send message</button>
    </form>
  </main>
</body>
</html>
